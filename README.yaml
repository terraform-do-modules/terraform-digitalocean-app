description: |-
  Terraform module to create and manage App Service on Digital Ocean.

usage: |-
  Here are some examples of how you can use this module in your inventory structure:
  ## basic example
  ```hcl
  module "app" {
    source          = "terraform-do-modules/app/digitalocean"
    version         = "1.0.8"
    spec = [{
      name   = "test"
      region = "nyc"

      domain = {
        name = "test.do.clouddrove.ca"
        type = "PRIMARY"
        zone = "do.clouddrove.ca"
      }

      service = {
        name = "librqary-nginx"
        image = {
          registry_type  = "DOCKER_HUB"
          registry       = "library"
          repository     = "nginx"
          tag            = "latest"
          internal_ports = "80"
          deploy_on_push = {
            enabled = true
          }
        }
        alert = {
          rule     = "CPU_UTILIZATION"
          value    = 50
          operator = "GREATER_THAN"
          window   = "FIVE_MINUTES"
          disabled = false
        }
      }
    }]
  }
  ```
  ## complete example
  ```hcl
  module "app" {
    source          = "terraform-do-modules/app/digitalocean"
    version         = "1.0.8"
    spec = [{
      name   = "test"
      region = "nyc"
      domain = {
        name = "test.do.clouddrove.ca"
        type = "PRIMARY"
        zone = "do.clouddrove.ca"
      }

      static_site = {
        name             = "blog"
        build_command    = "bundle exec jekyll build -d ./public"
        environment_slug = "hugo"
        output_dir       = "/public"

        git = {
          repo_clone_url = "https://github.com/digitalocean/sample-jekyll.git"
          branch         = "main"
        }

        routes = {
          path = "/"
        }
      }
    }]
  }
  ```

  ### Deploy with Terraform
  ```bash
  terraform init
  terraform plan
  terraform apply
  ```

  ### Deploy with OpenTofu
  ```bash
  tofu init
  tofu plan
  tofu apply
  ```